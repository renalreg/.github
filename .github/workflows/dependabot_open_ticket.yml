name: Dependabot Open Jira Ticket

on:
  workflow_call:
    inputs:
      
      project_code:
        type: string
        required: true
      
      issue_type:
        type: string
        default: Bug
      
      component:
        type: string
        default: Dependabot

jobs:
  dependabot-jira-ticket-creator:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout shared scripts
        uses: actions/checkout@v4
        with:
          repository: renalreg/.github
          ref: main
          path: _shared

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create Jira ticket
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_CODE: ${{ inputs.project_code }}
          JIRA_ISSUE_TYPE: ${{ inputs.issue_type }}
          JIRA_COMPONENT: ${{ inputs.component }}
        run: python _shared/.github/scripts/dependabot_open_jira_ticket.py