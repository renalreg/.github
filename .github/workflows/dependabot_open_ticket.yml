name: Dependabot Open Jira Ticket

on:
  workflow_call:
    inputs:
      
      project_code:
        type: string
        required: true
      
      issue_type:
        type: string
        default: Bug
      
      component:
        type: string
        default: Dependabot

      board_id:
        type: string
        default: ""

jobs:
  dependabot-jira-ticket-creator:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest

    steps:

      - name: Checkout shared scripts
        uses: actions/checkout@v4
        with:
          repository: renalreg/.github
          ref: main
          path: _shared

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve Jira ticket
        id: create-jira-ticket
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_CODE: ${{ inputs.project_code }}
          JIRA_ISSUE_TYPE: ${{ inputs.issue_type }}
          JIRA_COMPONENT: ${{ inputs.component }}
          JIRA_BOARD_ID: ${{ inputs.board_id }}
        run: python _shared/.github/scripts/dependabot_open_jira_ticket.py

      - name: Add Jira issue to PR title
        if: steps.create-jira-ticket.outputs.issue_key != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ORIGINAL_TITLE: ${{ github.event.pull_request.title }}
          ISSUE_KEY: ${{ steps.create-jira-ticket.outputs.issue_key }}
        run: |
          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --field "title=[${ISSUE_KEY}] ${ORIGINAL_TITLE}"