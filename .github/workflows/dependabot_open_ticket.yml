name: Dependabot Open Jira Ticket

on:
  workflow_call:
    inputs:
      
      project_code:
        type: string
        required: true
      
      issue_type:
        type: string
        default: Bug
      
      component:
        type: string
        default: Dependabot

      board_id:
        type: string
        default: ""

jobs:
  dependabot-jira-ticket-creator:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest

    steps:

      - name: Checkout shared scripts
        uses: actions/checkout@v4
        with:
          repository: renalreg/.github
          ref: main
          path: _shared

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve Jira ticket
        id: create-jira-ticket
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_CODE: ${{ inputs.project_code }}
          JIRA_ISSUE_TYPE: ${{ inputs.issue_type }}
          JIRA_COMPONENT: ${{ inputs.component }}
          JIRA_BOARD_ID: ${{ inputs.board_id }}
        run: python _shared/.github/scripts/dependabot_open_jira_ticket.py

      - name: Store Jira issue on PR
        if: steps.create-jira-ticket.outputs.issue_key != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ISSUE_KEY: ${{ steps.create-jira-ticket.outputs.issue_key }}
        run: |
          marker="<!-- dependabot-jira-key:${ISSUE_KEY} -->"
          exists=$(gh api \
            --paginate \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            | jq --slurp --arg marker "${marker}" \
              '[.[][] | .body | startswith($marker)] | any')
          if [[ "${exists}" != "true" ]]; then
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --field "body=${marker} Linked Jira issue: ${ISSUE_KEY}"
          fi

      - name: Recover Jira issue from PR
        id: recover-jira-ticket
        if: github.event.action != 'opened' && steps.create-jira-ticket.outputs.issue_key == ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          issue_key=$(gh api \
            --paginate \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            | jq --raw-output --slurp \
              '[.[][] | .body | select(test("^<!-- dependabot-jira-key:[A-Z][A-Z0-9_]*-[0-9]+ -->")) | capture("^<!-- dependabot-jira-key:(?<key>[A-Z][A-Z0-9_]*-[0-9]+) -->").key] | last // empty')
          if [[ -n "${issue_key}" ]]; then
            echo "issue_key=${issue_key}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Add Jira issue to PR title
        if: (steps.create-jira-ticket.outputs.issue_key || steps.recover-jira-ticket.outputs.issue_key) != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ORIGINAL_TITLE: ${{ github.event.pull_request.title }}
          ISSUE_KEY: ${{ steps.create-jira-ticket.outputs.issue_key || steps.recover-jira-ticket.outputs.issue_key }}
        run: |
          prefix="[${ISSUE_KEY}] "
          if [[ "${ORIGINAL_TITLE}" != "${prefix}"* ]]; then
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
              --field "title=${prefix}${ORIGINAL_TITLE}"
          fi